{% extends 'base.html' %}
{% block title %}Password reset complete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-check text-success" style="font-size:2.5rem"></i>
                <h1 class="page-title mt-3">Password updated</h1>
                <p class="text-muted">You can now sign in with your new password.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">Go to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
