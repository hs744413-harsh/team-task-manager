{% extends 'base.html' %}
{% block title %}Reset email sent{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-4 text-center">
                <i class="bi bi-envelope-check text-success" style="font-size:2.5rem"></i>
                <h1 class="page-title mt-3">Check your inbox</h1>
                <p class="text-muted">If an account matched the email you entered, we've sent password reset instructions.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
